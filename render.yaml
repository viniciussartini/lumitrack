# Blueprint da demo pública (ADR-0010) — Render.
# Passo a passo completo, incluindo o que precisa ser preenchido à mão:
# .claude/docs/DEPLOY.md, "Caminho A".
#
# Banco de dados NÃO é declarado aqui de propósito: o PostgreSQL gratuito do
# Render expira 30 dias após a criação. A demo usa Neon (gratuito, sem
# expiração), configurado por DATABASE_URL.

services:
    # ─── API + simulador IoT (mesmo container — ver Dockerfile na raiz) ───────
    - type: web
      name: lumitrack-api
      runtime: docker
      dockerfilePath: ./Dockerfile
      dockerContext: .
      plan: free
      region: oregon
      healthCheckPath: /health
      envVars:
          - key: NODE_ENV
            value: production

          # Valores fixos da demo — a razão de cada um está no checklist de
          # .claude/docs/DEPLOY.md e nos comentários de backend/.env.example.
          - key: REGISTRATION_ENABLED
            value: "false" # premissa de conformidade da ADR-0010 — nunca ligar aqui
          - key: DEMO_LOGIN_ENABLED
            value: "true"
          - key: IOT_ALLOWED_HOSTS
            # "localhost" precisa entrar como hostname (não só o CIDR do IP)
            # — dentro do container ele resolve para 127.0.0.1 E ::1
            # (dual-stack), e o guard de SSRF nega o host inteiro se
            # qualquer endereço resolvido não estiver coberto pela
            # allowlist (shared/security/outboundHost.ts). O medidor do
            # seed aponta para "localhost" (DEMO_METER_HOST), não para o IP
            # literal, então a entrada de hostname evita a resolução DNS
            # (e o IPv6 loopback não coberto) por completo.
            value: localhost,127.0.0.1/32
          - key: DEMO_BOOTSTRAP_ENABLED
            value: "true" # recria os devices do simulador a cada despertar
          - key: API_HOST
            value: 127.0.0.1 # API de controle do simulador nunca sai do container
          - key: BROKER_HOST
            value: 127.0.0.1

          # Segredos e URLs — preenchidos no painel do Render, nunca aqui.
          # `sync: false` faz o Render pedir o valor na criação do blueprint
          # e não sobrescrevê-lo em deploys seguintes.
          - key: DATABASE_URL
            sync: false # Neon, com ?sslmode=require
          - key: JWT_SECRET
            sync: false
          - key: CPF_CNPJ_ENCRYPTION_KEY
            sync: false
          - key: CPF_CNPJ_BLIND_INDEX_KEY
            sync: false
          - key: MFA_SECRET_ENCRYPTION_KEY
            sync: false
          - key: ADDRESS_ENCRYPTION_KEY
            sync: false
          - key: METER_CREDENTIAL_ENCRYPTION_KEY
            sync: false
          - key: SIMULATOR_API_TOKEN
            sync: false
          - key: BROKER_USERNAME
            sync: false
          - key: BROKER_PASSWORD
            sync: false

          # Obrigatórias no schema (config/env.ts) mesmo sem provedor real de
          # e-mail contratado — sem elas o backend recusa subir. A demo não
          # testa "esqueci minha senha" no checklist de verificação, então
          # qualquer valor placeholder satisfaz a validação; só vira
          # funcional de verdade se você contratar um provedor SMTP (o que
          # cria um operador — atualizar o ROPA nesse caso).
          - key: SMTP_HOST
            sync: false
          - key: SMTP_USER
            sync: false
          - key: SMTP_PASS
            sync: false
          - key: SMTP_FROM
            sync: false

          # Precisam do domínio final do site estático (ou do próprio serviço,
          # no caso de PUBLIC_API_ORIGIN) — ver a nota sobre o rewrite abaixo
          # e a seção de troubleshooting do DEPLOY.md.
          - key: CORS_ORIGIN
            sync: false
          - key: FRONTEND_URL
            sync: false
          - key: PUBLIC_API_ORIGIN
            sync: false

    # ─── SPA estática ────────────────────────────────────────────────────────
    # Sites estáticos do Render não hibernam — a interface carrega instantânea
    # mesmo com a API dormindo, e só os dados esperam o cold start.
    - type: web
      name: lumitrack
      runtime: static
      buildCommand: cd frontend && npm ci && npm run build
      staticPublishPath: frontend/dist
      envVars:
          # Vite resolve import.meta.env.VITE_* em BUILD time, não em
          # runtime — sem isso aqui, o botão de login de demonstração
          # (frontend/src/pages/auth/LoginPage.tsx) nunca aparece, mesmo com
          # DEMO_LOGIN_ENABLED=true no backend (são duas flags
          # independentes, sem fonte de verdade compartilhada).
          - key: VITE_DEMO_MODE
            value: "true"
          # O rewrite /api/* abaixo não sustenta conexão de longa duração
          # (SSE trava sem entregar dado através dele) — só essa chamada
          # aponta direto pra origem real da API, cross-origin. Precisa
          # bater com o mesmo valor usado em "destination" no rewrite
          # logo abaixo — se um mudar, o outro muda junto.
          - key: VITE_SSE_URL
            value: https://lumitrack-api.onrender.com/api/iot/stream
          # O CSP do próprio HTML (index.html) tem connect-src 'self' —
          # sem essa origem aqui, o navegador bloqueia a conexão do
          # VITE_SSE_URL acima antes mesmo de CORS entrar em jogo. Mesma
          # origem do VITE_SSE_URL (sem o path).
          - key: VITE_CSP_CONNECT_EXTRA
            value: https://lumitrack-api.onrender.com
          # Canal de comunicação com o titular (LGPD Art. 18 §1º + Res.
          # CD/ANPD 2/2022, Art. 11) — sem esta variável o build publica o
          # placeholder de frontend/src/config/privacy.ts como canal
          # oficial. Domínio ainda não decidido entre lumitrack.com.br e
          # lumitrack.app.br — troque junto com o registro definitivo.
          - key: VITE_PRIVACY_CONTACT_EMAIL
            value: contato@lumitrack.com.br
      routes:
          # ATENÇÃO — esta é a peça central do desenho, e a única que precisa
          # ser editada à mão depois do primeiro deploy: troque o destino pela
          # URL real do serviço `lumitrack-api` (blueprints do Render não
          # interpolam URL de serviço em destino de rota).
          #
          # O frontend chama a API por caminho relativo (`/api` em
          # services/api.ts). Este rewrite mantém tudo na mesma origem do
          # ponto de vista do browser, o que preserva sem alteração nenhuma:
          # cookie de sessão HttpOnly e CSRF double-submit.
          #
          # Exceção: o stream SSE (VITE_SSE_URL acima) vai direto pra API,
          # cross-origin — o rewrite não sustenta conexão de longa duração.
          # Isso NÃO exigiu enfraquecer o cookie de sessão (SameSite continua
          # "lax" em todo lugar): a chamada cross-origin se autentica por um
          # ticket de uso único (POST /api/iot/stream-ticket, same-origin,
          # trocado pela conexão via query string), não por cookie — ver
          # ADR-0010 e backend/src/modules/iot/sse-ticket.service.ts.
          - type: rewrite
            source: /api/*
            destination: https://lumitrack-api.onrender.com/api/*

          # Fallback da SPA — precisa vir DEPOIS da regra de /api (a primeira
          # correspondência vence).
          - type: rewrite
            source: /*
            destination: /index.html
