name: Keep-alive da demo

# Mantém o serviço lumitrack-api do Render acordado. O free tier hiberna
# após 15 min sem tráfego, com cold start de ~60-90s no despertar seguinte
# (ADR-0010, DEPLOY.md) — aceitável operacionalmente, mas ruim pra quem
# encontra a demo pela primeira vez (ex.: recrutador avaliando o portfólio)
# e cai bem nesse intervalo. Ping em /health a cada 10 min fica dentro da
# janela de 15 min com folga. /health é público, sem auth, e excluído do
# log de acesso (app.ts) — não gera ruído.
#
# GitHub desativa workflows agendados automaticamente após 60 dias sem
# nenhum commit no repositório — não é um problema aqui (repo ativo), mas é
# a razão de scheduled workflows não serem "garantidos para sempre".
#
# `cron` do GitHub Actions é melhor-esforço, não garantido — sob carga, o
# disparo pode atrasar ou ser descartado por completo, não só atrasar
# (issue #222). Minutos redondos (`*/10` = :00, :10, :20...) concorrem com
# um volume bem maior de workflows agendados no mesmo instante do que
# minutos deslocados; por isso o cron abaixo evita minutos redondos. Isso
# reduz a chance de descarte, não a elimina — não há garantia de SLA do
# GitHub pra scheduled workflows, deslocar o minuto é mitigação, não fix.

on:
    schedule:
        - cron: "7,17,27,37,47,57 * * * *"
    workflow_dispatch: {}

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping /health
              run: |
                  status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://lumitrack-api.onrender.com/health)
                  echo "status=$status"
                  if [ "$status" != "200" ]; then
                    echo "::warning::lumitrack-api respondeu $status em /health (pode ser cold start em andamento)"
                  fi
