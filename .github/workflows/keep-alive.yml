name: Keep-alive da demo (redundância)

# Mantém o serviço lumitrack-api do Render acordado. O free tier hiberna
# após 15 min sem tráfego, com cold start de ~60-90s no despertar seguinte
# (ADR-0010, DEPLOY.md) — aceitável operacionalmente, mas ruim pra quem
# encontra a demo pela primeira vez (ex.: recrutador avaliando o portfólio)
# e cai bem nesse intervalo. /health é público, sem auth, e excluído do
# log de acesso (app.ts) — não gera ruído.
#
# ESTE WORKFLOW É O MECANISMO REDUNDANTE, não o primário (ADR-0011,
# issue #229) — o ping primário é um monitor externo (UptimeRobot, a cada
# 5 min, configurado fora do repositório; ver DEPLOY.md § Keep-alive).
# Motivo da mudança: `cron` do GitHub Actions é melhor-esforço, não
# garantido — sob carga, o disparo pode atrasar ou ser descartado por
# completo, não só atrasar (issue #222). A mitigação abaixo (minutos
# não-redondos) reduz a chance de descarte, não a elimina; por isso este
# workflow continua rodando como segunda camada, em vez de ser removido —
# dois agendamentos independentes falharem no mesmo intervalo é bem menos
# provável que um falhar sozinho.
#
# GitHub desativa workflows agendados automaticamente após 60 dias sem
# nenhum commit no repositório — não é um problema aqui (repo ativo), mas é
# a razão de scheduled workflows não serem "garantidos para sempre".
#
# Minutos redondos (`*/10` = :00, :10, :20...) concorrem com um volume bem
# maior de workflows agendados no mesmo instante do que minutos deslocados;
# por isso o cron abaixo evita minutos redondos — reduz a chance de
# descarte, não a elimina.

on:
    schedule:
        - cron: "7,17,27,37,47,57 * * * *"
    workflow_dispatch: {}

# Mínimo do 11-seguranca-infraestrutura.md (P0) — o job só faz um `curl`
# público, sem tocar o repositório.
permissions:
    contents: read

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            # `run:` roda em `bash -eo pipefail` por padrão — sem o `|| true`
            # abaixo, um curl que estoura --max-time (cold start real, exit 28)
            # aborta o step ANTES da linha `if` rodar, e o job falha "alto" em
            # vez de só avisar (issue #221). `|| true` blinda a atribuição;
            # `${status:-timeout}` cobre o caso de curl não escrever nada em
            # stdout antes de falhar (timeout raramente escreve algo via -w).
            - name: Ping /health
              run: |
                  status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://lumitrack-api.onrender.com/health) || true
                  status="${status:-timeout}"
                  echo "status=$status"
                  if [ "$status" != "200" ]; then
                    echo "::warning::lumitrack-api respondeu $status em /health (pode ser cold start em andamento)"
                  fi
