name: CI

# #11 — CI/CD com gates de segurança (A03/A08 da auditoria OWASP/LGPD, ver
# .claude/docs/AUDITORIA_SEGURANCA.md). Roda em toda PR para main/staging e em
# push direto pras duas (Fase 13.7, ADR-0012 — staging passou a ser a base
# padrão de PR, main só recebe o PR de promoção staging→main). Todos os jobs
# usam `npm ci` (nunca `npm install`) — build reprodutível a partir do
# lockfile, peça central do gate de integridade.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Mínimo do 11-seguranca-infraestrutura.md (P0) — nenhum job deste workflow
# escreve no repositório, comenta em PR ou precisa de qualquer escopo além
# de ler o código (checkout, npm/docker, upload-artifact — este último usa
# o ACTIONS_RUNTIME_TOKEN injetado automaticamente, não o GITHUB_TOKEN, e
# não precisa de permissão extra aqui).
permissions:
  contents: read

env:
  NODE_VERSION: "24"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # #163 — gate de segurança (OWASP A03, supply chain): um segredo
  # commitado passa a quebrar o CI. Escaneia o histórico completo (não só o
  # diff do PR) porque os achados já triados (.gitleaks.toml) precisam
  # continuar allowlistados em toda execução, não só na primeira. Imagem
  # oficial do gitleaks, versão fixa — sem Action de terceiro no
  # Marketplace, mesmo padrão do resto do `ci.yml` (só `actions/*` oficiais).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "zricethezav/gitleaks:v${{ env.GITLEAKS_VERSION }}" \
            detect --source /repo --no-banner --redact

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b && vite build — cobre typecheck + build num único passo.
      - run: npm run build

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Bloqueia em high/critical. Moderate só gera aviso (não falha o
      # job) — ver achado A03 em .claude/docs/AUDITORIA_SEGURANCA.md sobre a vuln
      # moderada conhecida em devDependency do backend (sem fix ainda).
      - run: npm audit --audit-level=high
      - name: Relatório completo (não bloqueante)
        if: always()
        run: npm audit || true

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Fecha o gate que o PULL_REQUEST_TEMPLATE.md já declara obrigatório —
      # ver .dependency-cruiser.cjs (regra única: domínio não importa
      # framework/infra HTTP diretamente, 03-arquitetura.md).
      - run: npm run depcruise

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # `prisma.config.ts` resolve a datasource via `env("DATABASE_URL")` —
      # `prisma generate` nunca chega a conectar no banco, mas o loader do
      # config falha se a variável não existir. Valor descartável, nunca
      # usado para conexão real neste job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Garante que o client gerado nunca fica desatualizado em relação ao
      # schema.prisma versionado, mesmo que o build não dependa de banco.
      - run: npx prisma generate
      - run: npm run build

  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Relatório completo (não bloqueante)
        if: always()
        run: npm audit || true

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Nenhum destes valores é um segredo real — são descartáveis, só
      # para satisfazer a validação de env.ts neste ambiente de CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/lumitrack_test?schema=public
      DATABASE_HTTP_TEST_URL: postgresql://postgres:postgres@localhost:5432/lumitrack_test_http?schema=public
      JWT_SECRET: ci-only-dummy-secret-nao-e-usado-em-producao-32chars
      CPF_CNPJ_ENCRYPTION_KEY: 6fd4bad67bbdb0573f391bffdc1f0b3e710203034d07ace29e71bb1f49c835f4
      CPF_CNPJ_BLIND_INDEX_KEY: 25e6454d84f1a7348ee8a2410b6a244814e719d0fafb1cf30e54aa40ada5657d
      MFA_SECRET_ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
      ADDRESS_ENCRYPTION_KEY: f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9
      METER_CREDENTIAL_ENCRYPTION_KEY: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4
      SMTP_HOST: smtp.ci.invalid
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: "LumiTrack CI <ci@lumitrack.invalid>"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Criar bancos de teste
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE lumitrack_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE lumitrack_test_http;"
      - name: Aplicar migrations nos bancos de teste
        run: |
          DATABASE_URL="$DATABASE_TEST_URL" npx prisma migrate deploy
          DATABASE_URL="$DATABASE_HTTP_TEST_URL" npx prisma migrate deploy
      - run: npm test

  # iot-simulator/ é um workspace npm próprio (server + ui) — 03-arquitetura.md
  # o trata como o terceiro pacote independente do monorepo, mas até aqui
  # nenhum job rodava os 15 arquivos de teste dele nem auditava suas
  # dependências (broker MQTT `aedes` + servidor Express expostos sem gate).
  iot-simulator-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iot-simulator/package-lock.json
      - run: npm ci
      - run: npm run lint -w server -w ui
      - run: npm run format:check -w server -w ui

  iot-simulator-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iot-simulator/package-lock.json
      - run: npm ci
      - run: npm run build -w server -w ui

  iot-simulator-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-simulator
    env:
      # Nenhum destes valores é um segredo real — só para satisfazer a
      # validação de env.ts do simulador neste ambiente de CI (issue #180).
      SIMULATOR_API_TOKEN: ci-only-dummy-token-nao-usado-em-producao
      BROKER_USERNAME: ci-dummy-user
      BROKER_PASSWORD: ci-dummy-pass
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iot-simulator/package-lock.json
      - run: npm ci
      - run: npm test -w server -w ui

  iot-simulator-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iot-simulator/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high -w server -w ui
      - name: Relatório completo (não bloqueante)
        if: always()
        run: npm audit -w server -w ui || true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_TEST_URL/DATABASE_HTTP_TEST_URL não entram aqui: o backend
      # sobe via `npm run dev` (NODE_ENV != test), que nunca as lê — só os
      # fixtures do vitest (prisma-test.ts/prisma-http-test.ts) as consomem.
      # `envSchema` rejeita explicitamente elas apontarem para o mesmo banco
      # de DATABASE_URL; setá-las aqui = mesmo valor = falha no boot.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumitrack_e2e?schema=public
      JWT_SECRET: ci-only-dummy-secret-nao-e-usado-em-producao-32chars
      CPF_CNPJ_ENCRYPTION_KEY: 6fd4bad67bbdb0573f391bffdc1f0b3e710203034d07ace29e71bb1f49c835f4
      CPF_CNPJ_BLIND_INDEX_KEY: 25e6454d84f1a7348ee8a2410b6a244814e719d0fafb1cf30e54aa40ada5657d
      MFA_SECRET_ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
      ADDRESS_ENCRYPTION_KEY: f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9
      METER_CREDENTIAL_ENCRYPTION_KEY: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4
      SMTP_HOST: smtp.ci.invalid
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: "LumiTrack CI <ci@lumitrack.invalid>"
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci
      - name: Gerar client Prisma e aplicar migrations (banco e2e)
        working-directory: backend
        run: |
          npx prisma generate
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE lumitrack_e2e;"
          npx prisma migrate deploy

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar browsers do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Iniciar backend em background
        working-directory: backend
        run: |
          nohup npm run dev > /tmp/backend-e2e.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3333/health > /dev/null; then
              echo "Backend pronto."
              exit 0
            fi
            sleep 2
          done
          echo "Backend não respondeu a tempo." >&2
          exit 1

      - name: Rodar testes e2e (Playwright)
        working-directory: frontend
        run: npx playwright test

      - name: Upload do log do backend (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-log
          path: /tmp/backend-e2e.log
          retention-days: 7
