<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Anti-FOUC: aplica .dark em <html> ANTES do React montar.
      // Sem isso, usuários com tema dark veem flash branco no boot.
      // Use `var` e função tradicional pra suporte máximo de browsers.
      (function () {
        try {
          var stored = localStorage.getItem("lumitrack:theme")
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
          var isExplicitDark = stored === "dark"
          var isSystemDark =
            (stored === "system" || stored === null) && prefersDark

          if (isExplicitDark || isSystemDark) {
            document.documentElement.classList.add("dark")
          }
          
        } catch (e) {
          // Modo privado do Safari, etc — falha silenciosa
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
