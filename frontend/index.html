<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumiTrack</title>
    <script>
      // Anti-FOUC: aplica data-theme em <html> ANTES do React montar.
      // Sem isso, usuários com tema dark veem flash claro no boot.
      // Use `var` e função tradicional pra suporte máximo de browsers.
      // Convenção do design system Industry (ADR-0005) — era classe .dark.
      (function () {
        try {
          var stored = localStorage.getItem("lumitrack:theme")
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
          var isExplicitDark = stored === "dark"
          var isSystemDark =
            (stored === "system" || stored === null) && prefersDark

          document.documentElement.dataset.theme =
            isExplicitDark || isSystemDark ? "dark" : "light"
        } catch (e) {
          // Modo privado do Safari, etc — falha silenciosa
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
