<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP do SPA (issue #183). O hash cobre só o script anti-FOUC abaixo,
      byte a byte — Vite não transforma scripts inline não-module no build
      (confirmado comparando index.html com dist/index.html), então o hash
      não muda entre dev e produção. Se o conteúdo desse script mudar,
      recalcule com:
        node -e "const fs=require('fs'),c=require('crypto');
        const m=fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*?)<\/script>/);
        console.log('sha256-'+c.createHash('sha256').update(m[1],'utf8').digest('base64'))"
      `frame-ancestors`/`base-uri`/`object-src` não têm efeito via <meta>
      (só via header HTTP) — mantidos aqui documentando a intenção; o
      reverse proxy de produção (ADR-0008) deve enviar o header equivalente
      quando configurado.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-+up+7C+rtXMLX83AFmz9GUqo6C3J6ptqB1rNLtcKJRM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumiTrack</title>
    <script>
      // Anti-FOUC: aplica data-theme em <html> ANTES do React montar.
      // Sem isso, usuários com tema dark veem flash claro no boot.
      // Use `var` e função tradicional pra suporte máximo de browsers.
      // Convenção do design system Industry (ADR-0005) — era classe .dark.
      (function () {
        try {
          var stored = localStorage.getItem("lumitrack:theme")
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
          var isExplicitDark = stored === "dark"
          var isSystemDark =
            (stored === "system" || stored === null) && prefersDark

          document.documentElement.dataset.theme =
            isExplicitDark || isSystemDark ? "dark" : "light"
        } catch (e) {
          // Modo privado do Safari, etc — falha silenciosa
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
