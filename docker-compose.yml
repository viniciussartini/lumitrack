# Orquestração de produção da Fase 13.5 (go-live) — ver .claude/docs/DEPLOY.md
# para o passo a passo completo e .claude/docs/adr/0008-hospedagem-brasil-oracle-always-free.md
# para a topologia e o racional de hospedagem (VM única, sem operador estrangeiro).
#
# Variáveis deste arquivo (${...}) vêm de deploy/.env (copiar de deploy/.env.example).
# Os serviços de aplicação (backend, simulator) usam seus próprios .env
# (backend/.env, iot-simulator/server/.env — copiados dos respectivos
# .env.example) via env_file, nunca variáveis inline aqui.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # `shared_preload_libraries` só tem efeito com o servidor iniciado com a
    # flag — não dá para ativar via `CREATE EXTENSION` depois.
    # `pg_stat_statements.track=all` inclui queries chamadas de dentro de
    # função, não só as de nível superior.
    # NOTA para um volume já existente (produção já provisionada antes desta
    # mudança): mudar este `command` exige `docker compose up -d postgres`
    # (recria o container) E rodar manualmente
    # `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;` — o init script
    # abaixo só roda sozinho em volume novo, vazio.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    env_file:
      - deploy/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Rodam uma única vez, no primeiro boot com volume vazio — criam o
      # papel de runtime sem DDL (deploy/create-app-role.sql) e habilitam a
      # extensão de instrumentação (deploy/enable-pg-stat-statements.sql).
      # Reprovisionar do zero (ex.: volume novo) recria os dois automaticamente.
      - ./deploy/create-app-role.sql:/docker-entrypoint-initdb.d/10-create-app-role.sql:ro
      - ./deploy/enable-pg-stat-statements.sql:/docker-entrypoint-initdb.d/20-enable-pg-stat-statements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem `ports:` — só a rede interna do compose alcança o Postgres.
    # Backup roda via `docker compose exec postgres pg_dump` (deploy/backup-postgres.sh),
    # nunca expondo 5432 ao host ou à internet.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: 30s # folga para o graceful shutdown (flush do MinuteBuffer) em server.ts
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Sem `ports:` publicado — só o Caddy fala com o backend (rede interna,
    # `reverse_proxy backend:3333` no Caddyfile).

  simulator:
    build:
      context: ./iot-simulator
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - iot-simulator/server/.env
    # Rede própria (a mesma `lumitrack_default` dos demais serviços, por
    # padrão do compose) — não mais `network_mode: "service:backend"` (ver
    # ADR-0017, que revisa a decisão de co-localização de rede da ADR-0008).
    # Sem `network_mode` compartilhado, `backend` alcança a API (4100) e o
    # broker MQTT (1883) do simulador via DNS interno do compose, no
    # hostname do serviço: `simulator:4100`/`simulator:1883` — exige
    # `BROKER_HOST=0.0.0.0`/`API_HOST=0.0.0.0` no `iot-simulator/server/.env`
    # de produção (o container escuta em todas as interfaces DELE; o que
    # continua fechado é a ausência de `ports:` aqui, que impede qualquer
    # alcance do host ou da internet — só outros containers desta rede
    # interna chegam nele). Sem `depends_on: backend`: as duas conexões são
    # independentes agora, e reiniciar uma não derruba a rede da outra.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro # build do frontend acontece fora do compose — ver DEPLOY.md
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    ports:
      # Só loopback do HOST — nunca 0.0.0.0. Acesso via túnel SSH
      # (`ssh -L 3001:localhost:3001 <host>`), documentado no DEPLOY.md.
      # Monitor interno aponta para http://backend:3333/health (DNS do compose).
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  kuma_data:
